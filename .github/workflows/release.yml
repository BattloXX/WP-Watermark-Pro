name: Release plugin zip

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify plugin header/version match the tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          HEADER_VERSION=$(grep -m1 -oP '^\s*\*\s*Version:\s*\K[0-9][0-9A-Za-z.\-]*' watermark-pro.php || true)
          CONST_VERSION=$(grep -m1 -oP "define\(\s*'WM_VERSION',\s*'\K[^']+" watermark-pro.php || true)

          echo "Tag version:    $VERSION"
          echo "Header version: $HEADER_VERSION"
          echo "Const version:  $CONST_VERSION"

          if [ -z "$HEADER_VERSION" ] || [ -z "$CONST_VERSION" ]; then
            echo "::error::Could not read Version header or WM_VERSION constant from watermark-pro.php."
            exit 1
          fi

          if [ "$VERSION" != "$HEADER_VERSION" ] || [ "$VERSION" != "$CONST_VERSION" ]; then
            echo "::error::Version mismatch — git tag says $VERSION, plugin header says $HEADER_VERSION, WM_VERSION constant says $CONST_VERSION. Bump watermark-pro.php (both the header comment and the WM_VERSION constant) to $VERSION before tagging a release."
            exit 1
          fi

      - name: Lint PHP sources
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build plugin zip
        run: git archive --format=zip --prefix=watermark-pro/ -o watermark-pro.zip HEAD

      - name: Verify zip contains a valid plugin header at the expected path
        run: |
          set -euo pipefail
          if ! unzip -p watermark-pro.zip watermark-pro/watermark-pro.php | grep -q '^ \* Plugin Name:'; then
            echo "::error::Built zip does not contain a readable 'Plugin Name:' header at watermark-pro/watermark-pro.php — WordPress would refuse to activate this package."
            exit 1
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" watermark-pro.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" watermark-pro.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi
